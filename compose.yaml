name: jobs-mcp
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - jobs_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    # No host port: only containers on this Compose network can reach PostgreSQL.

  mcp:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: jobs
      PGUSER: jobs
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  tunnel:
    image: ngrok/ngrok:latest
    profiles: [tunnel]
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: [http, "http://mcp:3000"]
    depends_on:
      mcp:
        condition: service_healthy

volumes:
  jobs_data:
